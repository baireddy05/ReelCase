<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reelcase</title>
    <meta name="theme-color" content="#f8fafc" id="themeColorMeta">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-logo">
                <img src="logo.svg" alt="Reelcase logo" class="app-logo-img">
                <h1>Reelcase</h1>
            </div>
            <div class="header-actions">
                <button id="darkModeToggle" class="dark-mode-toggle" title="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="loginBtn" class="auth-btn outline"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
                <button id="logoutBtn" class="auth-btn outline" style="display: none;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>

        <main>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search for a movie or series...">
                <div id="searchResults" class="search-results"></div>
            </div>

            <!-- Desktop Tabs -->
            <div class="tabs desktop-only"></div>

            <div id="bucketLists"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav mobile-only"></nav>

    <!-- Modals -->
    <div id="detailModalOverlay" class="modal-overlay"></div>
    <div id="confirmModalOverlay" class="modal-overlay"></div>
    
    <!-- Auth Modal -->
    <div id="authModalOverlay" class="modal-overlay">
        <div class="auth-container" id="authContainer">
            <h2>Authentication</h2>
            <button id="googleSignInBtn" class="google-btn">
                <i class="fa-brands fa-google"></i> Sign in with Google
            </button>
            <div class="divider"><span>OR</span></div>
            <form id="emailLoginForm">
                <input type="email" id="emailInput" placeholder="Email" required>
                <input type="password" id="passwordInput" placeholder="Password" required>
                <button type="submit" class="email-btn">Login</button>
            </form>
            <a href="#" id="toggleAuthModeBtn" class="toggle-auth">Need an account? Sign Up</a>
        </div>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
